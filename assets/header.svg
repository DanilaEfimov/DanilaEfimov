<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150d2b"/>
      <stop offset="1" stop-color="#2a1150"/>
    </linearGradient>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset=".25" stop-color="#ffb86b"/>
      <stop offset=".5" stop-color="#7cffb2"/>
      <stop offset=".75" stop-color="#6bb8ff"/>
      <stop offset="1" stop-color="#c77dff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type">
      <rect x="0" y="130" height="40" width="0">
        <animate attributeName="width" from="0" to="900" dur="3.2s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <path id="star" d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z"/>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>

  <!-- rainbow waves -->
  <g fill="none" stroke="url(#rb)" stroke-width="7" stroke-linecap="round">
    <path opacity=".9" d="M-150 205 q37.5 -26 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-150 0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path opacity=".55" transform="translate(0 14)" d="M-150 205 q37.5 26 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0">
      <animateTransform attributeName="transform" type="translate" from="0 14" to="-150 14" dur="6s" repeatCount="indefinite"/>
    </path>
    <path opacity=".3" d="M-150 235 q37.5 -26 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0">
      <animateTransform attributeName="transform" type="translate" from="-75 0" to="-225 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <use href="#star" x="90" y="50"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#star" x="810" y="42"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.7s" repeatCount="indefinite"/></use>
    <use href="#star" x="740" y="150"><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="1.1s" repeatCount="indefinite"/></use>
    <use href="#star" x="160" y="150"><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="0.3s" repeatCount="indefinite"/></use>
    <use href="#star" x="470" y="26"><animate attributeName="opacity" values="0;1;0" dur="3.3s" begin="1.6s" repeatCount="indefinite"/></use>
    <use href="#star" x="610" y="165"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></use>
  </g>

  <!-- title -->
  <text x="450" y="106" text-anchor="middle" font-family="'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="78" font-weight="700" fill="url(#rb)" filter="url(#glow)">goodogott</text>

  <!-- typed subtitle -->
  <g clip-path="url(#type)">
    <text x="450" y="158" text-anchor="middle" font-family="'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="21" fill="#e9dcff">C++ · Python · ponies · vtubing · chaos</text>
  </g>
  <rect x="210" y="140" width="10" height="22" fill="#ff77c8">
    <animate attributeName="x" from="210" to="692" dur="3.2s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
